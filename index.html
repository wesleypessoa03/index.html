<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de contas</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1E8;
  --surface:#FFFDF8;
  --surface-2:#EBE6D6;
  --line:#DAD3BC;
  --ink:#26301F;
  --ink-soft:#6B6A57;
  --forest:#2F5233;
  --forest-deep:#203A24;
  --forest-tint:#E4EEDF;
  --rust:#9E4530;
  --rust-tint:#F6E7DE;
  --gold:#A9762C;
  --gold-tint:#F5E9D3;
  --danger:#9E4530;
  --shadow:0 1px 2px rgba(38,48,31,.06), 0 6px 18px rgba(38,48,31,.07);
  --shadow-lift:0 10px 28px rgba(38,48,31,.14);
  --radius:12px;
  --radius-sm:8px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--forest-tint);color:var(--forest-deep)}
::placeholder{color:var(--ink-soft);opacity:.7}

.app{min-height:100vh}

.header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--forest);color:#fff;display:grid;place-items:center;font-size:17px}
.brandText{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:19px;letter-spacing:-.01em}
.user{display:flex;align-items:center;gap:11px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;font-family:'IBM Plex Mono',monospace}
.switch{border:1px solid var(--line);background:transparent;border-radius:20px;padding:7px 14px;color:var(--ink-soft);font-size:12.5px;transition:border-color .15s,color .15s}
.switch:hover{border-color:var(--forest);color:var(--forest)}

.tabs{display:flex;gap:4px;padding:16px 32px 0;background:var(--paper);flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font-size:13.5px;font-weight:500;padding:10px 18px;border-radius:0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink-soft);margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab.active{background:transparent;color:var(--forest-deep);font-weight:600;border-bottom:2px solid var(--forest)}

.main{padding:32px 32px 56px;background:var(--paper);min-height:calc(100vh - 96px)}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:12px;color:var(--ink-soft);font-weight:500}
.title{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:600;margin:2px 0 0;color:var(--ink);letter-spacing:-.01em}
.total{text-align:right}
.total small{display:block;color:var(--ink-soft);font-size:12px;margin-bottom:2px}
.money{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:23px;color:var(--gold)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card,.newcard{min-height:126px;border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--surface);text-align:left;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s}
.card{display:flex;flex-direction:column;gap:16px}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--line)}
.cardtop{display:flex;justify-content:space-between;align-items:flex-start}
.bankicon{width:32px;height:32px;border-radius:8px;background:var(--forest-tint);border:1px solid var(--line);display:grid;place-items:center;color:var(--forest-deep);font-size:15px}
.banktag{font-size:10.5px;color:var(--ink-soft);background:var(--surface-2);padding:3px 8px;border-radius:20px}
.accountname{font-weight:600;font-size:15.5px;font-family:'Fraunces',Georgia,serif}
.pending{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:500}
.label{font-size:12px;color:var(--ink-soft);margin-top:2px}
.newcard{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:transparent;border:1.5px dashed var(--line);color:var(--ink-soft);box-shadow:none;font-size:14px}
.newcard:hover{border-color:var(--forest);color:var(--forest-deep)}
.clearmonth{border:1px solid var(--line);background:var(--surface);color:var(--rust);border-radius:var(--radius-sm);padding:9px 14px;font-size:12.5px;white-space:nowrap;transition:border-color .15s,background .15s}
.clearmonth:hover{border-color:var(--rust);background:var(--rust-tint)}

.formcard{display:flex;flex-direction:column;gap:9px;padding:16px;background:var(--surface);border:1.5px solid var(--forest);border-radius:var(--radius);min-width:0;max-width:100%;box-shadow:var(--shadow)}
.input{border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;background:var(--surface);outline:none;width:100%;min-width:0;max-width:100%;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--forest);box-shadow:0 0 0 3px var(--forest-tint)}
.actions{display:flex;justify-content:flex-end;gap:6px}
.icon{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);transition:border-color .15s,color .15s}
.icon:hover{border-color:var(--ink-soft);color:var(--ink)}
.ok{background:var(--forest);color:#fff;border:0}
.ok:hover{background:var(--forest-deep);color:#fff}
.empty{color:var(--ink-soft);font-size:13.5px;margin-top:18px}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(700px 400px at 15% -5%, var(--forest-tint) 0%, transparent 60%),
  var(--paper)}
.loginin{width:100%;max-width:660px}
.login h1{font-family:'Fraunces',Georgia,serif;font-size:36px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 32px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:14px}
.ucard,.newuser{position:relative;padding:22px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.ucard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.udel{position:absolute;top:7px;right:7px;width:23px;height:23px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--rust);font-size:12px;line-height:1;display:grid;place-items:center}
.ucard .bigavatar,.newuser .plus{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:auto auto 11px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.newuser{border:1.5px dashed var(--line);background:transparent;color:var(--ink-soft);box-shadow:none}
.newuser:hover{border-color:var(--forest);color:var(--forest-deep)}
.newuser .plus{border:1.5px dashed var(--line)}
.newform{display:flex;gap:8px;padding:16px;background:var(--surface);border:1.5px solid var(--forest);border-radius:var(--radius);box-shadow:var(--shadow)}
.newform input{flex:1}
.error{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--forest-deep);color:#F4F1E8;padding:9px 18px;border-radius:20px;font-size:13px;z-index:100;box-shadow:var(--shadow-lift)}

.overlay{position:fixed;inset:0;background:rgba(38,48,31,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.panel{width:100%;max-width:920px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:16px;padding:28px;box-shadow:var(--shadow-lift)}
.phead{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
.ptexts{flex:1}
.editable{font-family:'Fraunces',Georgia,serif;font-size:23px;font-weight:600;margin:0;cursor:text}
.subedit{font-size:12.5px;color:var(--ink-soft);margin:5px 0;cursor:text}
.danger{color:var(--rust);border-color:var(--line)}
.danger:hover{border-color:var(--rust);background:var(--rust-tint)}
.summary{display:flex;align-items:center;gap:22px;background:var(--surface-2);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;flex-wrap:wrap}
.sumlabel{font-size:11.5px;color:var(--ink-soft);margin-bottom:3px}
.sumvalue{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:500}
.divider{width:1px;align-self:stretch;background:var(--line)}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.caltitle{font-size:15.5px;font-weight:600;font-family:'Fraunces',Georgia,serif}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.add{border:0;background:var(--forest-tint);color:var(--forest-deep);border-radius:var(--radius-sm);padding:10px 15px;font-weight:500;transition:background .15s}
.add:hover{background:#D6E6CE}
.days{display:grid;grid-template-columns:repeat(7,minmax(64px,1fr));gap:8px;margin-bottom:20px}
.day{min-height:70px;position:relative;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:9px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:border-color .15s,background .15s}
.day:hover{border-color:var(--forest)}
.day.noactivity{background:var(--paper)}
.day.dayoff{background:var(--surface-2);border-color:var(--line);opacity:.75}
.offtag{font-size:8.5px;letter-spacing:.03em;color:var(--ink-soft)}
.day.sel{border-color:var(--forest);box-shadow:0 0 0 2px var(--forest-tint);background:var(--forest-tint)}
.daynum{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px}
.count{position:absolute;right:6px;top:6px;min-width:19px;height:19px;border-radius:10px;background:var(--gold);border:0;font-size:10px;font-family:'IBM Plex Mono',monospace;display:grid;place-items:center;color:#fff}
.dots{display:flex;gap:4px}
.dot{width:7px;height:7px;border-radius:50%}
.pay{background:var(--rust)}
.receive{background:var(--forest)}
.selected{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.selhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.seltitle{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600}
.meta{font-size:11.5px;color:var(--ink-soft)}
.addday{border:1px solid var(--forest);background:var(--surface);color:var(--forest-deep);border-radius:var(--radius-sm);padding:8px 12px;font-size:12.5px;transition:background .15s}
.addday:hover{background:var(--forest-tint)}
.task{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:var(--radius-sm);background:var(--surface);margin-bottom:7px;cursor:pointer;border:1px solid transparent;transition:border-color .15s}
.task:hover{border-color:var(--line)}
.check{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);flex:0 0 auto}
.check.done{background:var(--forest);border-color:var(--forest);color:#fff}
.taskbody{flex:1;min-width:0}
.desc{font-size:13.5px;font-weight:500}
.desc.done{text-decoration:line-through;color:var(--ink-soft)}
.taskmeta{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.taskval{font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--gold);font-weight:500}
.trash{border:0;background:transparent;color:var(--ink-soft);transition:color .15s}
.trash:hover{color:var(--ink)}
.taskform{display:flex;flex-direction:column;gap:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0;max-width:100%}
.row{display:flex;gap:8px;min-width:0}
.row>*{flex:1;min-width:0}
.row .value{flex:0 0 130px;min-width:0}
.confirm{display:flex;align-items:center;gap:6px}
.yes{font-size:12px;color:#fff;background:var(--rust);border:0;border-radius:6px;padding:6px 10px}
.no{font-size:12px;color:var(--ink-soft);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px}

.respbox{border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px;background:var(--surface);max-height:132px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.respitem{display:flex;align-items:center;gap:7px;font-size:13.5px}
.obs textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px;font:inherit;resize:vertical;background:var(--surface)}

.kanbanWrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-height:230px;display:flex;flex-direction:column;gap:10px}
.kcolhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:0 2px}
.kcount{font-size:11px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-weight:500;font-family:'IBM Plex Mono',monospace}

.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.kcard:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift)}
.kcard.dragging{opacity:.4}
.kdesc{font-size:13.5px;font-weight:600}
.kval{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500}
.kchips{display:flex;flex-wrap:wrap;gap:5px}
.kchip{font-size:10.5px;background:var(--forest-tint);color:var(--forest-deep);border-radius:20px;padding:3px 9px}
.kaddbtn{border:1px dashed var(--line);background:transparent;color:var(--ink-soft);border-radius:var(--radius-sm);padding:9px;font-size:12.5px;margin-top:2px;width:100%;transition:border-color .15s,color .15s}
.kaddbtn:hover{border-color:var(--forest);color:var(--forest-deep)}

@media(max-width:700px){.days{grid-template-columns:repeat(4,minmax(58px,1fr))}.header{padding:14px 18px}.tabs,.main{padding-left:18px;padding-right:18px}.panel{padding:18px}}
@media(max-width:480px){.days{grid-template-columns:repeat(3,minmax(58px,1fr))}.row{flex-direction:column}.row .value{flex:auto}}
@media(max-width:800px){.kanbanWrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
/* ======== CONFIGURAÇÃO DO FIREBASE ========
   Substitua os valores abaixo pelos do SEU projeto Firebase
   (Console do Firebase > Configurações do projeto > Seus apps > SDK setup and configuration).
*/
const firebaseConfig = {
  apiKey: "AIzaSyBh_8-sGajSddRp0QXaAKGoASigBFNBEZM",
  authDomain: "site-803f0.firebaseapp.com",
  projectId: "site-803f0",
  storageBucket: "site-803f0.firebasestorage.app",
  messagingSenderId: "1067717918092",
  appId: "1:1067717918092:web:b56c4c55658bb804eceaa9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("controle-contas").doc("dados");
/* ============================================ */

const COLORS=[["#E4EEDF","#203A24"],["#E6EEF3","#25445C"],["#F6E7DE","#7A3A22"],["#F3E4EA","#6B2A45"],["#F5E9D3","#6B4A16"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const initials=n=>String(n||"").trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()||"").join("");
const KSTATUS=[["afazer","A fazer"],["fazendo","Fazendo"],["feito","Feito"]];
const fresh=()=>({users:[],companies:[{id:uid(),name:"Fazenda"},{id:uid(),name:"Trielo"},{id:uid(),name:"APR"}],accounts:[],tasks:[],kanban:{receber:[],pagar:[]}});

let data=null, connError=false;
let current=null, company=null, selected=null;
let tab=null, selectedDay=null;
let kanbanSelected=null, kanbanFormOpen=null, draggedItem=null;

function ensureDefaults(){
 if(!data.users) data.users=[];
 if(!data.companies||!data.companies.length) data.companies=[{id:uid(),name:"Fazenda"},{id:uid(),name:"Trielo"},{id:uid(),name:"APR"}];
 if(!data.accounts) data.accounts=[];
 if(!data.tasks) data.tasks=[];
 if(!data.kanban) data.kanban={receber:[],pagar:[]};
 if(!Array.isArray(data.kanban.receber)) data.kanban.receber=[];
 if(!Array.isArray(data.kanban.pagar)) data.kanban.pagar=[];
 data.tasks.forEach(t=>{ if(t.responsavel && !t.responsaveis) t.responsaveis=[t.responsavel]; if(!t.responsaveis) t.responsaveis=[]; if(t.observacao===undefined) t.observacao=""; });
 if(!company||!data.companies.some(c=>c.id===company)) company=data.companies[0]?.id||null;
}

function save(){
 docRef.set(data).catch(err=>{ console.error("Erro ao salvar no Firestore:",err); connError=true; render(); });
}

docRef.onSnapshot(snap=>{
 if(snap.exists){ data=snap.data(); }
 else { data=fresh(); docRef.set(data); }
 connError=false;
 ensureDefaults();
 render();
}, err=>{
 console.error("Erro de conexão com o Firestore:",err);
 connError=true;
 render();
});
function render(){
 if(connError){$("root").innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:\'Source Sans 3\',system-ui,sans-serif;color:#9E4530"><div><b>Não foi possível conectar ao banco de dados.</b><br><span style="color:#6B6A57;font-size:13px">Verifique sua internet ou a configuração do Firebase (firebaseConfig) no arquivo.</span></div></div>';return}
 if(!data){$("root").innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:\'Source Sans 3\',system-ui,sans-serif;color:#6B6A57">Carregando…</div>';return}
 const scrollY=window.scrollY;
 const openPanel=document.querySelector(".panel");
 const panelScroll=openPanel?openPanel.scrollTop:0;
 doRender();
 window.scrollTo(0,scrollY);
 const newPanel=document.querySelector(".panel");
 if(newPanel)newPanel.scrollTop=panelScroll;
}
function headerHtml(){
 return `<header class="header"><div class="brand"><div class="mark">☷</div><span class="brandText">Controle de contas</span></div>
<div class="user"><div class="avatar" style="background:${current.color.bg};color:${current.color.fg}">${esc(initials(current.name))}</div><span>${esc(current.name)}</span><button class="switch" id="switch">↪ Trocar usuário</button></div></header>`;
}
function tabsHtml(){
 return data.companies.map(c=>`<button class="tab ${!tab&&c.id===company?"active":""}" data-company="${c.id}">${esc(c.name)}</button>`).join("")
 +`<button class="tab ${tab==='receber'?"active":""}" data-kanbantab="receber">Pendências A Receber</button>`
 +`<button class="tab ${tab==='pagar'?"active":""}" data-kanbantab="pagar">Pendências A Pagar</button>`;
}
function doRender(){
 if(!current){renderLogin();return}
 if(tab){renderKanbanBoard();return}
 const co=data.companies.find(x=>x.id===company)||data.companies[0]; company=co?.id;
 const accounts=data.accounts.filter(a=>a.companyId===company);
 const total=accounts.reduce((s,a)=>s+data.tasks.filter(t=>t.accountId===a.id&&t.status==="pendente").reduce((q,t)=>q+Number(t.value||0),0),0);
 $("root").innerHTML=`<div class="app">
${headerHtml()}
<nav class="tabs">${tabsHtml()}</nav>
<main class="main"><div class="head"><div><div class="eyebrow">Módulo</div><h2 class="title">${esc(co?.name||"")}</h2></div><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><button class="clearmonth" id="clearMonth">🗑 Apagar pendências / Virada de mês</button><div class="total"><small>Total pendente</small><div class="money">${brl(total)}</div></div></div></div>
<div class="grid">${accounts.map(a=>card(a)).join("")}<div id="newAccount">${newAccount()}</div></div>
${accounts.length?"":`<p class="empty">Nenhuma conta bancária cadastrada em ${esc(co?.name||"")} ainda.</p>`}</main>
</div>${selected?detail(selected):""}`;
 bind();
}
function renderLogin(){
 $("root").innerHTML=`<div class="login"><div class="loginin"><div class="eyebrow">CONTROLE DE PENDÊNCIAS · CONTAS BANCÁRIAS</div><h1>Quem está acessando?</h1><p class="sub">Selecione seu quadro para entrar. Sem senha — apenas identificação.</p><div class="users">${data.users.map(u=>`<div class="ucard" data-user="${u.id}"><button class="udel" data-deluser="${u.id}" title="Excluir usuário">×</button><div class="bigavatar" style="background:${u.color.bg};color:${u.color.fg}">${esc(initials(u.name))}</div><div>${esc(u.name)}</div></div>`).join("")}<button class="newuser" id="newUser"><div class="plus">＋</div><div>Novo usuário</div></button></div></div></div>`;
 $("newUser").onclick=()=>{ $("newUser").outerHTML=`<div class="newform" id="newForm"><input class="input" id="userName" placeholder="Seu nome" autofocus><button class="icon" id="cancel">×</button><button class="icon ok" id="create">✓</button></div>`;$("cancel").onclick=render;$("create").onclick=createUser;$("userName").onkeydown=e=>{if(e.key==="Enter")createUser()};};
 document.querySelectorAll("[data-user]").forEach(b=>b.onclick=()=>{current=data.users.find(u=>u.id===b.dataset.user);render()});
 document.querySelectorAll("[data-deluser]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();let u=data.users.find(x=>x.id===b.dataset.deluser);if(u&&confirm("Excluir o usuário \""+u.name+"\"? Isso não apaga contas nem pendências já lançadas.")){data.users=data.users.filter(x=>x.id!==u.id);save();render()}}));
}
function createUser(){let n=$("userName").value.trim();if(!n)return;let c=COLORS[data.users.length%COLORS.length];let u={id:uid(),name:n,color:{bg:c[0],fg:c[1]}};data.users.push(u);save();current=u;render()}
function card(a){let ts=data.tasks.filter(t=>t.accountId===a.id&&t.status==="pendente"), total=ts.reduce((s,t)=>s+Number(t.value||0),0);return `<button class="card" data-account="${a.id}"><div class="cardtop"><div class="bankicon">🏦</div>${a.bank?`<span class="banktag">${esc(a.bank)}</span>`:""}</div><div class="accountname">${esc(a.name)}</div><div><div class="pending">${brl(total)}</div><div class="label">${ts.length?ts.length+" pendência"+(ts.length>1?"s":""):"sem pendências"}</div></div></button>`}
function newAccount(){return `<button class="newcard" id="addAccount">＋<span>Nova conta bancária</span></button>`}
function detail(id){
 let a=data.accounts.find(x=>x.id===id), ts=data.tasks.filter(t=>t.accountId===id);
 let day=selectedDay, offDays=getOffDays();
 let scope=day!==null?ts.filter(t=>Number(String(t.day||"").slice(-2))===day):ts;
 let pay=scope.filter(t=>t.status==="pendente"&&t.type==="A pagar").reduce((s,t)=>s+Number(t.value||0),0), rec=scope.filter(t=>t.status==="pendente"&&t.type==="A receber").reduce((s,t)=>s+Number(t.value||0),0), pend=scope.filter(t=>t.status==="pendente").length, done=scope.filter(t=>t.status==="concluida").length;
 return `<div class="overlay" id="overlay"><div class="panel" onclick="event.stopPropagation()"><div class="phead"><button class="icon" id="close">←</button><div class="ptexts"><h3 class="editable" id="editName">${esc(a.name)} ✎</h3><p class="subedit" id="editBank">${esc(a.bank||"adicionar banco")}</p></div><button class="icon danger" id="deleteAccount">🗑</button></div>
<div class="hint" style="margin-bottom:8px">${day!==null?"Resumo do dia "+day+" (clique no dia de novo para ver o resumo geral)":"Resumo geral da conta"}</div>
<div class="summary"><div><div class="sumlabel">A pagar</div><div class="sumvalue" style="color:#9E4530">${brl(pay)}</div></div><div class="divider"></div><div><div class="sumlabel">A receber</div><div class="sumvalue" style="color:#2F5233">${brl(rec)}</div></div><div class="divider"></div><div><div class="sumlabel">Pendências</div><div class="sumvalue">${pend}</div></div><div class="divider"></div><div><div class="sumlabel">Concluídas</div><div class="sumvalue">${done}</div></div></div>
<div class="calhead"><div><div class="caltitle">Pendências por dia</div><div class="hint">Clique em um dia para ver as pendências e registrar novas.</div></div><button class="add" id="newTask">＋ Nova pendência</button></div>
<div class="days">${Array.from({length:31},(_,i)=>i+1).map(n=>dayBox(n,ts,day,offDays)).join("")}</div>
${day!==null?dayPanel(day,ts,offDays):""}<div id="taskForm"></div></div></div>`
}
function getOffDays(){let co=data.companies.find(x=>x.id===company);if(!co)return[];if(!co.offDays)co.offDays=[];return co.offDays}
function dayBox(n,ts,d,offDays){let x=ts.filter(t=>Number(String(t.day||"").slice(-2))===n&&t.status==="pendente"), any=ts.some(t=>Number(String(t.day||"").slice(-2))===n), off=offDays.includes(n), p=x.some(t=>t.type==="A pagar"),r=x.some(t=>t.type==="A receber");return `<button class="day ${d===n?"sel":""} ${off?"dayoff":(any?"":"noactivity")}" data-day="${n}"><span class="daynum">${n}</span>${x.length?`<span class="count">${x.length}</span>`:""}<div class="dots">${p?'<span class="dot pay"></span>':""}${r?'<span class="dot receive"></span>':""}</div>${off?'<span class="offtag">Folga</span>':""}</button>`}
function dayPanel(d,ts,offDays){let x=ts.filter(t=>Number(String(t.day||"").slice(-2))===d), off=offDays.includes(d);return `<div class="selected"><div class="selhead"><div><div class="seltitle">Dia ${d}</div><div class="meta">${x.length} registro(s)</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="addday" id="toggleOff" data-day="${d}">${off?"✓ Fim de semana/feriado":"Marcar fim de semana/feriado"}</button><button class="addday" id="addDay">＋ Registrar pendência neste dia</button></div></div>${x.length?x.sort((a,b)=>(a.status===b.status?0:a.status==="pendente"?-1:1)).map(task).join(""):'<div class="meta" style="padding:18px;text-align:center">Nenhuma pendência registrada neste dia.</div>'}</div>`}
function task(t){let done=t.status==="concluida";let resp=(t.responsaveis||[]).map(id=>data.users.find(u=>u.id===id)).filter(Boolean);return `<div class="task" data-taskrow="${t.id}"><button class="check ${done?"done":""}" data-toggle="${t.id}">${done?"✓":""}</button><div class="taskbody"><div class="desc ${done?"done":""}">${esc(t.description)}</div><div class="taskmeta">por ${esc(t.createdBy)} · <span style="color:${t.type==="A receber"?"#2F5233":"#9E4530"}">${esc(t.type||"A pagar")}</span>${resp.length?" · responsáveis: "+resp.map(u=>esc(u.name)).join(", "):""}${t.observacao?" · 📝":""}</div></div><div class="taskval" style="${done?"color:#6B6A57":""}">${brl(t.value)}</div><button class="trash" data-edit="${t.id}" title="Editar">✎</button><button class="trash" data-delete="${t.id}" title="Excluir">🗑</button></div>`}
function respChecksHtml(selectedIds){selectedIds=selectedIds||[];return data.users.length?data.users.map(u=>`<label class="respitem"><input type="checkbox" value="${u.id}" ${selectedIds.includes(u.id)?"checked":""}> ${esc(u.name)}</label>`).join(""):'<span class="hint">Nenhum usuário cadastrado</span>'}
function form(day,taskId){
 let t=taskId?data.tasks.find(x=>x.id===taskId):null;
 let d=t?t.day:(day?new Date().toISOString().slice(0,7)+"-"+String(day).padStart(2,"0"):today());
 $("taskForm").innerHTML=`<div class="taskform"><b style="font-size:12px;color:#203A24">${t?"Editar pendência":(day?"Nova pendência — dia "+day:"Nova pendência")}</b><div class="row"><input class="input" type="date" id="td" value="${d}"><select class="input" id="tt"><option ${(t&&t.type==="A pagar")||!t?"selected":""}>A pagar</option><option ${t&&t.type==="A receber"?"selected":""}>A receber</option></select><input class="input value" type="number" step="0.01" placeholder="Valor (R$)" id="tv" value="${t?t.value:""}"></div><input class="input" id="tdesc" placeholder="Descrição da pendência" value="${t?esc(t.description):""}"><div class="hint">Responsáveis</div><div class="respbox" id="trespbox">${respChecksHtml(t?t.responsaveis:[])}</div><div class="hint">Observação</div><div class="obs"><textarea id="tobs" placeholder="Adicionar observação (opcional)">${t?esc(t.observacao||""):""}</textarea></div><div class="actions">${t?'<button class="icon danger" id="fdel" title="Excluir">🗑</button>':""}<button class="icon" id="fc">×</button><button class="icon ok" id="fs">✓</button></div></div>`;$("tdesc").focus();$("fc").onclick=()=>{$("taskForm").innerHTML=""};$("fs").onclick=()=>saveTask(taskId);$("tdesc").onkeydown=e=>{if(e.key==="Enter")saveTask(taskId)};if(t){$("fdel").onclick=()=>{if(confirm("Excluir esta pendência?")){data.tasks=data.tasks.filter(x=>x.id!==t.id);save();render()}}}
}
function saveTask(taskId){
 let d=$("td").value,desc=$("tdesc").value.trim();if(!d||!desc)return;
 let value=Number($("tv").value)||0,type=$("tt").value;
 let responsaveis=Array.from(document.querySelectorAll("#trespbox input:checked")).map(c=>c.value);
 let observacao=$("tobs").value;
 if(taskId){let t=data.tasks.find(x=>x.id===taskId);t.day=d;t.description=desc;t.value=value;t.type=type;t.responsaveis=responsaveis;t.observacao=observacao;delete t.responsavel;}
 else{data.tasks.push({id:uid(),accountId:selected,day:d,description:desc,value,type,status:"pendente",createdBy:current.name,responsaveis,observacao})}
 save();render();
}

/* ---------- Kanban: Pendências A Receber / A Pagar ---------- */
function renderKanbanBoard(){
 const kind=tab, label=kind==='receber'?"Pendências A Receber":"Pendências A Pagar";
 const items=data.kanban[kind];
 $("root").innerHTML=`<div class="app">
${headerHtml()}
<nav class="tabs">${tabsHtml()}</nav>
<main class="main"><div class="head"><div><div class="eyebrow">Módulo</div><h2 class="title">${label}</h2></div></div>
<div class="kanbanWrap">${KSTATUS.map(([st,lbl])=>kanbanColumn(kind,st,lbl,items)).join("")}</div>
</main></div>${kanbanSelected?kanbanDetailPanel(kind):""}`;
 bindKanban(kind);
}
function kanbanColumn(kind,status,label,items){
 const list=items.filter(i=>i.status===status);
 const formOpen=kanbanFormOpen===status;
 return `<div class="kcol" data-dropcol="${status}"><div class="kcolhead"><span>${label}</span><span class="kcount">${list.length}</span></div>${list.map(i=>kanbanCard(kind,i,status)).join("")}${(!list.length&&!formOpen)?'<div class="hint" style="text-align:center;padding:10px 0">Nenhum item</div>':""}<div id="kaddform-${status}">${formOpen?kanbanAddFormHtml(kind,status):""}</div>${formOpen?"":`<button class="kaddbtn" data-kaddopen="${status}">＋ Adicionar pendência</button>`}</div>`
}
function kanbanCard(kind,item,status){
 let resp=(item.responsaveis||[]).map(id=>data.users.find(u=>u.id===id)).filter(Boolean);
 return `<div class="kcard" draggable="true" data-kcard="${item.id}">
<div class="kdesc">${esc(item.description)}${item.observacao?" 📝":""}</div>
<div class="kval" style="color:${kind==='receber'?'#2F5233':'#9E4530'}">${brl(item.value)}</div>
${resp.length?`<div class="kchips">${resp.map(u=>`<span class="kchip">${esc(u.name)}</span>`).join("")}</div>`:""}
</div>`
}
function kanbanAddFormHtml(kind,status){
 return `<div class="taskform" style="margin:8px 0"><b style="font-size:12px;color:#203A24">Nova pendência ${kind==='receber'?'a receber':'a pagar'}</b>
<input class="input" id="kndesc" placeholder="Descrição da pendência">
<div class="row"><input class="input value" type="number" step="0.01" placeholder="Valor (R$)" id="knval"></div>
<div class="hint">Responsáveis</div>
<div class="respbox" id="knrespbox">${respChecksHtml([])}</div>
<div class="hint">Observação</div>
<div class="obs"><textarea id="knobs" placeholder="Observação (opcional)"></textarea></div>
<div class="actions"><button class="icon" data-kaddclose="${status}">×</button><button class="icon ok" data-kaddsave="${status}">✓</button></div>
</div>`
}
function kanbanDetailPanel(kind){
 const item=data.kanban[kind].find(i=>i.id===kanbanSelected);
 if(!item)return "";
 return `<div class="overlay" id="koverlay"><div class="panel" onclick="event.stopPropagation()" style="max-width:560px">
<div class="phead"><button class="icon" id="kclose">←</button><div class="ptexts"><h3 class="editable" style="cursor:default;font-size:19px">${kind==='receber'?'Pendência a receber':'Pendência a pagar'}</h3></div><button class="icon danger" id="kdelete" title="Excluir">🗑</button></div>
<div class="hint" style="margin-bottom:6px">Descrição</div>
<input class="input" id="kdesc" value="${esc(item.description)}" style="margin-bottom:12px">
<div class="row" style="margin-bottom:12px">
<div><div class="hint" style="margin-bottom:6px">Valor</div><input class="input value" type="number" step="0.01" id="kval" value="${item.value}"></div>
<div><div class="hint" style="margin-bottom:6px">Status</div><select class="input" id="kstatus">${KSTATUS.map(([st,lbl])=>`<option value="${st}" ${item.status===st?"selected":""}>${lbl}</option>`).join("")}</select></div>
</div>
<div class="hint" style="margin-bottom:6px">Responsáveis</div>
<div class="respbox" id="krespbox">${respChecksHtml(item.responsaveis)}</div>
<div class="hint" style="margin:12px 0 6px">Observação</div>
<div class="obs"><textarea id="kobs" placeholder="Adicionar observação...">${esc(item.observacao||"")}</textarea></div>
<div class="actions" style="margin-top:14px"><button class="icon" id="kcancel">Fechar</button><button class="icon ok" id="ksave">Salvar</button></div>
</div></div>`
}
function saveNewKanban(kind,status){
 const desc=$("kndesc").value.trim();if(!desc)return;
 const value=Number($("knval").value)||0;
 const responsaveis=Array.from(document.querySelectorAll("#knrespbox input:checked")).map(c=>c.value);
 const observacao=$("knobs").value;
 data.kanban[kind].push({id:uid(),description:desc,value,status:status||"afazer",responsaveis,observacao,createdBy:current.name,createdAt:today()});
 save();kanbanFormOpen=null;render();
}
function bindKanban(kind){
 $("switch")?.addEventListener("click",()=>{current=null;tab=null;kanbanSelected=null;kanbanFormOpen=null;render()});
 document.querySelectorAll("[data-company]").forEach(b=>b.onclick=()=>{tab=null;company=b.dataset.company;selected=null;selectedDay=null;render()});
 document.querySelectorAll("[data-kanbantab]").forEach(b=>b.onclick=()=>{tab=b.dataset.kanbantab;kanbanSelected=null;kanbanFormOpen=null;render()});
 document.querySelectorAll("[data-kaddopen]").forEach(b=>b.onclick=()=>{kanbanFormOpen=b.dataset.kaddopen;render()});
 document.querySelectorAll("[data-kaddclose]").forEach(b=>b.onclick=()=>{kanbanFormOpen=null;render()});
 document.querySelectorAll("[data-kaddsave]").forEach(b=>b.onclick=()=>saveNewKanban(kind,b.dataset.kaddsave));
 if(kanbanFormOpen){
  $("kndesc")?.focus();
  if($("kndesc"))$("kndesc").onkeydown=e=>{if(e.key==="Enter")saveNewKanban(kind,kanbanFormOpen)};
 }
 document.querySelectorAll("[data-kcard]").forEach(el=>{
  el.addEventListener("click",()=>{kanbanSelected=el.dataset.kcard;render()});
  el.addEventListener("dragstart",e=>{draggedItem=el.dataset.kcard;el.classList.add("dragging");e.dataTransfer.effectAllowed="move"});
  el.addEventListener("dragend",()=>{el.classList.remove("dragging");draggedItem=null});
 });
 document.querySelectorAll("[data-dropcol]").forEach(col=>{
  col.addEventListener("dragover",e=>{e.preventDefault()});
  col.addEventListener("drop",e=>{
   e.preventDefault();if(!draggedItem)return;
   const item=data.kanban[kind].find(i=>i.id===draggedItem);
   if(item){item.status=col.dataset.dropcol;save()}
   draggedItem=null;render();
  });
 });
 $("koverlay")?.addEventListener("click",e=>{if(e.target.id==="koverlay"){kanbanSelected=null;render()}});
 $("kclose")?.addEventListener("click",()=>{kanbanSelected=null;render()});
 $("kcancel")?.addEventListener("click",()=>{kanbanSelected=null;render()});
 $("kdelete")?.addEventListener("click",()=>{if(confirm("Excluir esta pendência?")){data.kanban[kind]=data.kanban[kind].filter(i=>i.id!==kanbanSelected);save();kanbanSelected=null;render()}});
 $("ksave")?.addEventListener("click",()=>{
  const item=data.kanban[kind].find(i=>i.id===kanbanSelected);if(!item)return;
  item.description=$("kdesc").value.trim()||item.description;
  item.value=Number($("kval").value)||0;
  item.status=$("kstatus").value;
  item.responsaveis=Array.from(document.querySelectorAll("#krespbox input:checked")).map(c=>c.value);
  item.observacao=$("kobs").value;
  save();kanbanSelected=null;render();
 });
}

function bind(){
 $("switch")?.addEventListener("click",()=>{current=null;tab=null;selected=null;render()});
 document.querySelectorAll("[data-company]").forEach(b=>b.onclick=()=>{tab=null;company=b.dataset.company;selected=null;selectedDay=null;render()});
 document.querySelectorAll("[data-kanbantab]").forEach(b=>b.onclick=()=>{tab=b.dataset.kanbantab;kanbanSelected=null;kanbanFormOpen=false;render()});
 document.querySelectorAll("[data-account]").forEach(b=>b.onclick=()=>{selected=b.dataset.account;selectedDay=null;render()});
 $("addAccount")?.addEventListener("click",()=>{ $("newAccount").innerHTML=`<div class="formcard"><input class="input" id="an" placeholder="Nome da conta" autofocus><input class="input" id="ab" placeholder="Banco (opcional)"><div class="actions"><button class="icon" id="ac">×</button><button class="icon ok" id="as">✓</button></div></div>`;$("ac").onclick=render;$("as").onclick=addAccount;$("ab").onkeydown=e=>{if(e.key==="Enter")addAccount()};});
 $("overlay")?.addEventListener("click",e=>{if(e.target.id==="overlay"){selected=null;selectedDay=null;render()}});
 $("close")?.addEventListener("click",()=>{selected=null;selectedDay=null;render()});
 $("newTask")?.addEventListener("click",()=>form(null));
 $("addDay")?.addEventListener("click",()=>form(selectedDay));
 $("toggleOff")?.addEventListener("click",()=>{let n=Number($("toggleOff").dataset.day),off=getOffDays(),i=off.indexOf(n);if(i>=0)off.splice(i,1);else off.push(n);save();render()});
 document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{let n=Number(b.dataset.day);selectedDay=selectedDay===n?null:n;render()});
 document.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();let t=data.tasks.find(t=>t.id===b.dataset.toggle);t.status=t.status==="pendente"?"concluida":"pendente";save();render()}));
 document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();form(selectedDay,b.dataset.edit)}));
 document.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();data.tasks=data.tasks.filter(t=>t.id!==b.dataset.delete);save();render()}));
 document.querySelectorAll("[data-taskrow]").forEach(el=>el.addEventListener("click",e=>{if(e.target.closest("button"))return;form(selectedDay,el.dataset.taskrow)}));
 $("deleteAccount")?.addEventListener("click",()=>{if(confirm("Excluir esta conta e todas as pendências dela?")){data.accounts=data.accounts.filter(a=>a.id!==selected);data.tasks=data.tasks.filter(t=>t.accountId!==selected);save();selected=null;render()}});
 $("clearMonth")?.addEventListener("click",()=>{const accs=data.accounts.filter(a=>a.companyId===company);if(!accs.length)return;const co=data.companies.find(x=>x.id===company);if(confirm("Apagar TODAS as pendências das contas de \""+(co?.name||"")+"\"? Essa ação não pode ser desfeita.")){const ids=accs.map(a=>a.id);data.tasks=data.tasks.filter(t=>!ids.includes(t.accountId));save();render()}});
 $("editName")?.addEventListener("click",()=>editAccount("name"));
 $("editBank")?.addEventListener("click",()=>editAccount("bank"));
}
function editAccount(field){let a=data.accounts.find(x=>x.id===selected), el=field==="name"?$("editName"):$("editBank"), old=a[field]||"";let inp=document.createElement("input");inp.className="input";inp.value=old;el.replaceWith(inp);inp.focus();inp.select();let done=()=>{a[field]=inp.value.trim();save();render()};inp.onblur=done;inp.onkeydown=e=>{if(e.key==="Enter")done();if(e.key==="Escape")render()}}
function addAccount(){let n=$("an").value.trim();if(!n)return;data.accounts.push({id:uid(),companyId:company,name:n,bank:$("ab").value.trim()});save();render()}
render();
})();

</script>

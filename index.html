<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de contas</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1E8;
  --surface:#FFFDF8;
  --surface-2:#EBE6D6;
  --line:#DAD3BC;
  --ink:#26301F;
  --ink-soft:#6B6A57;
  --forest:#2F5233;
  --forest-deep:#203A24;
  --forest-tint:#E4EEDF;
  --forest-strong:#C7E0BB;
  --rust:#9E4530;
  --rust-tint:#F6E7DE;
  --gold:#A9762C;
  --gold-tint:#F5E9D3;
  --danger:#9E4530;
  --shadow:0 1px 2px rgba(38,48,31,.06), 0 6px 18px rgba(38,48,31,.07);
  --shadow-lift:0 10px 28px rgba(38,48,31,.14);
  --radius:12px;
  --radius-sm:8px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--forest-tint);color:var(--forest-deep)}
::placeholder{color:var(--ink-soft);opacity:.7}

.app{min-height:100vh}

.header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--forest);color:#fff;display:grid;place-items:center;font-size:17px}
.brandText{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:19px;letter-spacing:-.01em}
.user{display:flex;align-items:center;gap:11px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;font-family:'IBM Plex Mono',monospace}
.switch{border:1px solid var(--line);background:transparent;border-radius:20px;padding:7px 14px;color:var(--ink-soft);font-size:12.5px;font-family:'Fraunces',Georgia,serif;font-weight:500;transition:border-color .15s,color .15s}
.switch:hover{border-color:var(--forest);color:var(--forest)}

.tabs{display:flex;gap:4px;padding:10px 32px 0;background:var(--paper);flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font-family:'Fraunces',Georgia,serif;font-size:15.5px;font-weight:500;padding:8px 18px;border-radius:0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink-soft);margin-bottom:-1px;letter-spacing:-.005em;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab.active{background:transparent;color:var(--forest-deep);font-weight:600;border-bottom:2px solid var(--forest)}

.main{padding:32px 32px 56px;background:var(--paper);min-height:calc(100vh - 96px)}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;color:var(--ink-soft);font-weight:600;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
.title{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:700;margin:2px 0 0;color:var(--ink);letter-spacing:-.01em}
.total{text-align:right}
.total small{display:block;color:var(--ink-soft);font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.money{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:23px;color:var(--gold);letter-spacing:-.01em;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card,.newcard{min-height:126px;border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--surface);text-align:left;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s}
.card{display:flex;flex-direction:column;gap:16px}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--line)}
.cardtop{display:flex;justify-content:space-between;align-items:flex-start}
.bankicon{width:32px;height:32px;border-radius:8px;background:var(--forest-tint);border:1px solid var(--line);display:grid;place-items:center;color:var(--forest-deep);font-size:15px}
.banktag{font-size:10px;color:var(--ink-soft);background:var(--surface-2);padding:3px 8px;border-radius:20px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.04em}
.accountname{font-weight:700;font-size:21px;font-family:'Source Serif 4',Georgia,serif;letter-spacing:-.005em;line-height:1.15}
.pending{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--gold)}
.label{font-size:11.5px;color:var(--ink-soft);margin-top:2px;font-family:'IBM Plex Mono',monospace}
.cardtop-right{display:flex;align-items:center;gap:8px}
.daycircle{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:var(--forest-tint);border:1px solid var(--forest-strong);color:var(--forest-deep);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.newcard{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:transparent;border:1.5px dashed var(--line);color:var(--ink-soft);box-shadow:none;font-family:'Fraunces',Georgia,serif;font-size:14px}
.newcard:hover{border-color:var(--forest);color:var(--forest-deep)}
.clearmonth{border:1px solid var(--line);background:var(--surface);color:var(--rust);border-radius:var(--radius-sm);padding:9px 14px;font-family:'Fraunces',Georgia,serif;font-size:12.5px;font-weight:500;white-space:nowrap;transition:border-color .15s,background .15s}
.clearmonth:hover{border-color:var(--rust);background:var(--rust-tint)}

.formcard{display:flex;flex-direction:column;gap:9px;padding:16px;background:var(--surface);border:1.5px solid var(--forest);border-radius:var(--radius);min-width:0;max-width:100%;box-shadow:var(--shadow)}
.input{border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;background:var(--surface);outline:none;width:100%;min-width:0;max-width:100%;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--forest);box-shadow:0 0 0 3px var(--forest-tint)}
.actions{display:flex;justify-content:flex-end;gap:6px}
.icon{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);transition:border-color .15s,color .15s}
.icon:hover{border-color:var(--ink-soft);color:var(--ink)}
.ok{background:var(--forest);color:#fff;border:0}
.ok:hover{background:var(--forest-deep);color:#fff}
.empty{color:var(--ink-soft);font-size:13.5px;margin-top:18px}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(700px 400px at 15% -5%, var(--forest-tint) 0%, transparent 60%),
  var(--paper)}
.loginin{width:100%;max-width:660px}
.login h1{font-family:'Fraunces',Georgia,serif;font-size:36px;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
.sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 32px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:14px}
.ucard,.newuser{position:relative;padding:22px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.ucard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.udel{position:absolute;top:7px;right:7px;width:23px;height:23px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--rust);font-size:12px;line-height:1;display:grid;place-items:center}
.ucard .bigavatar,.newuser .plus{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:auto auto 11px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.newuser{border:1.5px dashed var(--line);background:transparent;color:var(--ink-soft);box-shadow:none}
.newuser:hover{border-color:var(--forest);color:var(--forest-deep)}
.newuser .plus{border:1.5px dashed var(--line)}
.newform{display:flex;gap:8px;padding:16px;background:var(--surface);border:1.5px solid var(--forest);border-radius:var(--radius);box-shadow:var(--shadow)}
.newform input{flex:1}
.error{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--forest-deep);color:#F4F1E8;padding:9px 18px;border-radius:20px;font-size:13px;z-index:100;box-shadow:var(--shadow-lift)}

.overlay{position:fixed;inset:0;background:rgba(38,48,31,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.panel{width:100%;max-width:920px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:16px;padding:28px;box-shadow:var(--shadow-lift)}
.phead{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
.ptexts{flex:1}
.editable{font-family:'Source Serif 4',Georgia,serif;font-size:23px;font-weight:600;margin:0;cursor:text}
.subedit{font-size:12.5px;color:var(--ink-soft);margin:5px 0;cursor:text}
.danger{color:var(--rust);border-color:var(--line)}
.danger:hover{border-color:var(--rust);background:var(--rust-tint)}
.summary{display:flex;align-items:center;gap:22px;background:var(--surface-2);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;flex-wrap:wrap}
.sumlabel{font-size:11px;color:var(--ink-soft);margin-bottom:3px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em}
.sumvalue{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.divider{width:1px;align-self:stretch;background:var(--line)}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.daysStepper{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;background:var(--surface)}
.daysStepper span{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.daysStepper button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:14px;line-height:1;display:grid;place-items:center;transition:border-color .15s,color .15s}
.daysStepper button:hover:not(:disabled){border-color:var(--forest);color:var(--forest-deep)}
.daysStepper button:disabled{opacity:.35;cursor:not-allowed}
.caltitle{font-size:15.5px;font-weight:700;font-family:'Fraunces',Georgia,serif}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.add{border:0;background:var(--forest-tint);color:var(--forest-deep);border-radius:var(--radius-sm);padding:10px 15px;font-family:'Fraunces',Georgia,serif;font-weight:500;transition:background .15s}
.add:hover{background:#D6E6CE}
.days{display:grid;grid-template-columns:repeat(7,minmax(64px,1fr));gap:8px;margin-bottom:20px}
.day{height:80px;position:relative;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:9px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:border-color .15s,background .15s}
.day:hover{border-color:var(--forest)}
.day.noactivity{background:var(--paper)}
.day.dayoff{background:var(--surface-2);border-color:var(--line);opacity:.75}
.day.daydone{background:var(--forest-strong);border-color:var(--forest);opacity:1}
.day.daydone .daynum{color:var(--forest-deep)}
.daytag{position:absolute;right:6px;bottom:6px;font-size:8.5px;letter-spacing:.03em;color:var(--ink-soft);pointer-events:none}
.day.daydone .daytag{color:var(--forest-deep);font-weight:600}
.day.sel{border-color:var(--forest);box-shadow:0 0 0 2px var(--forest-tint)}
.daynum{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px}
.count{position:absolute;right:6px;top:6px;min-width:19px;height:19px;border-radius:10px;background:var(--gold);border:0;font-size:10px;font-family:'IBM Plex Mono',monospace;display:grid;place-items:center;color:#fff}
.dots{display:flex;gap:4px}
.dot{width:7px;height:7px;border-radius:50%}
.pay{background:var(--rust)}
.receive{background:var(--forest)}
.selected{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.selhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.seltitle{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:700}
.meta{font-size:11.5px;color:var(--ink-soft)}
.addday{border:1px solid var(--forest);background:var(--surface);color:var(--forest-deep);border-radius:var(--radius-sm);padding:8px 12px;font-family:'Fraunces',Georgia,serif;font-size:12.5px;font-weight:500;transition:background .15s}
.addday:hover{background:var(--forest-tint)}
.addday.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.addday.on:hover{background:var(--forest-deep)}
.task{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:var(--radius-sm);background:var(--surface);margin-bottom:7px;cursor:pointer;border:1px solid transparent;transition:border-color .15s}
.task:hover{border-color:var(--line)}
.check{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);flex:0 0 auto}
.check.done{background:var(--forest);border-color:var(--forest);color:#fff}
.taskbody{flex:1;min-width:0}
.desc{font-size:14px;font-weight:600;font-family:'Fraunces',Georgia,serif}
.desc.done{text-decoration:line-through;color:var(--ink-soft)}
.taskmeta{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.taskval{font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.trash{border:0;background:transparent;color:var(--ink-soft);transition:color .15s}
.trash:hover{color:var(--ink)}
.taskform{display:flex;flex-direction:column;gap:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0;max-width:100%}
.row{display:flex;gap:8px;min-width:0}
.row>*{flex:1;min-width:0}
.row .value{flex:0 0 130px;min-width:0}
.confirm{display:flex;align-items:center;gap:6px}
.yes{font-size:12px;color:#fff;background:var(--rust);border:0;border-radius:6px;padding:6px 10px}
.no{font-size:12px;color:var(--ink-soft);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px}

.respbox{border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px;background:var(--surface);max-height:132px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.respitem{display:flex;align-items:center;gap:7px;font-size:13.5px}
.obs textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px;font:inherit;resize:vertical;background:var(--surface)}

.kanbanWrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-height:230px;display:flex;flex-direction:column;gap:10px}
.kcolhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:0 2px}
.kcount{font-size:11px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-weight:500;font-family:'IBM Plex Mono',monospace}

.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.kcard:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift)}
.kcard.dragging{opacity:.4}
.kdesc{font-size:14px;font-weight:700;font-family:'Fraunces',Georgia,serif}
.kval{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.kchips{display:flex;flex-wrap:wrap;gap:5px}
.kchip{font-size:10.5px;background:var(--forest-tint);color:var(--forest-deep);border-radius:20px;padding:3px 9px}
.kaddbtn{border:1px dashed var(--line);background:transparent;color:var(--ink-soft);border-radius:var(--radius-sm);padding:9px;font-size:12.5px;margin-top:2px;width:100%;transition:border-color .15s,color .15s}
.kaddbtn:hover{border-color:var(--forest);color:var(--forest-deep)}

.mysec{margin-top:26px}
.mysectitle{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:700;margin-bottom:10px}
.mybox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px}

@media(max-width:700px){.days{grid-template-columns:repeat(4,minmax(58px,1fr))}.header{padding:14px 18px}.tabs,.main{padding-left:18px;padding-right:18px}.panel{padding:18px}}
@media(max-width:480px){.days{grid-template-columns:repeat(3,minmax(58px,1fr))}.row{flex-direction:column}.row .value{flex:auto}}
@media(max-width:800px){.kanbanWrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
/* ======== CONFIGURAÇÃO DO FIREBASE ========
   Substitua os valores abaixo pelos do SEU projeto Firebase
   (Console do Firebase > Configurações do projeto > Seus apps > SDK setup and configuration).
*/
const firebaseConfig = {
  apiKey: "AIzaSyBh_8-sGajSddRp0QXaAKGoASigBFNBEZM",
  authDomain: "site-803f0.firebaseapp.com",
  projectId: "site-803f0",
  storageBucket: "site-803f0.firebasestorage.app",
  messagingSenderId: "1067717918092",
  appId: "1:1067717918092:web:b56c4c55658bb804eceaa9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("controle-contas").doc("dados");
/* ============================================ */

const COLORS=[["#E4EEDF","#203A24"],["#E6EEF3","#25445C"],["#F6E7DE","#7A3A22"],["#F3E4EA","#6B2A45"],["#F5E9D3","#6B4A16"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const initials=n=>String(n||"").trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()||"").join("");
const KSTATUS=[["afazer","A fazer"],["fazendo","Fazendo"],["feito","Feito"]];
const fresh=()=>({users:[],companies:[{id:uid(),name:"Fazenda"},{id:uid(),name:"Trielo"},{id:uid(),name:"APR"}],accounts:[],tasks:[],kanban:{receber:[],pagar:[]},recurring:[]});
const WEEKDAYS=[[0,"domingo"],[1,"segunda-feira"],[2,"terça-feira"],[3,"quarta-feira"],[4,"quinta-feira"],[5,"sexta-feira"],[6,"sábado"]];

/* ---------- Valores em formato brasileiro (1.234,56) ---------- */
function parseNum(v){
 if(typeof v==="number")return v;
 let s=String(v??"").trim();
 if(!s)return 0;
 s=s.replace(/[^\d.,-]/g,"");
 if(!s)return 0;
 if(s.indexOf(",")>=0){
  s=s.replace(/\./g,"").replace(",",".");
 }else{
  const parts=s.split(".");
  if(parts.length>2){ s=parts.join(""); }
  else if(parts.length===2 && parts[1].length===3){ s=parts.join(""); }
 }
 const n=Number(s);
 return isNaN(n)?0:n;
}
function fmtNum(v){
 const n=Number(v)||0;
 return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function bindMoney(el){
 if(!el)return;
 el.addEventListener("blur",()=>{ const n=parseNum(el.value); el.value=n?fmtNum(n):""; });
 el.addEventListener("focus",()=>el.select());
}

let data=null, connError=false;
let current=null, company=null, selected=null;
let tab=null, selectedDays=[];
let kanbanSelected=null, kanbanFormOpen=null, draggedItem=null;
let recurringFormOpen=null;
function dayOf(t){return Number(String(t.day||"").slice(-2))}

function ensureDefaults(){
 if(!data.users) data.users=[];
 if(!data.companies||!data.companies.length) data.companies=[{id:uid(),name:"Fazenda"},{id:uid(),name:"Trielo"},{id:uid(),name:"APR"}];
 if(!data.accounts) data.accounts=[];
 if(!data.tasks) data.tasks=[];
 if(!data.kanban) data.kanban={receber:[],pagar:[]};
 if(!Array.isArray(data.kanban.receber)) data.kanban.receber=[];

/* ---------- Baixas fixas: geração automática das pendências do dia ---------- */
function generateRecurringTasks(){
 if(!Array.isArray(data.recurring)||!data.recurring.length)return false;
 const now=new Date();
 const y=now.getFullYear(), m=now.getMonth();
 const ym=y+"-"+String(m+1).padStart(2,"0");
 const todayNum=now.getDate();
 let changed=false;
 data.recurring.forEach(r=>{
  const acc=data.accounts.find(a=>a.id===r.accountId);
  if(!acc)return;
  const co=data.companies.find(c=>c.id===acc.companyId);
  const totalDays=(co&&co.totalDays)?co.totalDays:31;
  const off=(co&&Array.isArray(co.offDays))?co.offDays:[];
  let occurrences=[];
  if(r.scheduleMode==="weekday"){
   for(let n=1;n<=totalDays;n++){ if(new Date(y,m,n).getDay()===r.weekday) occurrences.push(n); }
  }else{
   let n=Number(r.day)||1; if(n<1)n=1; if(n>totalDays)n=totalDays;
   occurrences.push(n);
  }
  occurrences.forEach(orig=>{
   let target=orig;
   while(off.includes(target)&&target<totalDays){ target++; }
   if(target>todayNum)return;
   const key=r.id+"-"+ym+"-"+orig;
   if(data.tasks.some(t=>t.recurringKey===key))return;
   data.tasks.push({id:uid(),accountId:r.accountId,day:ym+"-"+String(target).padStart(2,"0"),description:r.description,value:r.value||0,type:r.type,status:"pendente",createdBy:r.createdBy||"Baixa fixa",responsaveis:(r.responsaveis||[]).slice(),observacao:"",recurringId:r.id,recurringKey:key});
   changed=true;
  });
 });
 return changed;
}

function getOffDays(){let co=data.companies.find(x=>x.id===company);if(!co)return[];if(!Array.isArray(co.offDays))co.offDays=[];return co.offDays}
function getDoneDays(){let a=data.accounts.find(x=>x.id===selected);if(!a)return[];if(!Array.isArray(a.doneDays))a.doneDays=[];return a.doneDays}
function getTotalDays(){let co=data.companies.find(x=>x.id===company);if(!co)return 31;if(!co.totalDays||co.totalDays<28||co.totalDays>31)co.totalDays=31;return co.totalDays}
function changeTotalDays(delta){
 let co=data.companies.find(x=>x.id===company); if(!co) return;
 let cur=co.totalDays||31, next=cur+delta;
 if(next<28||next>31) return;
 if(delta<0){
  let n=cur;
  let accs=data.accounts.filter(a=>a.companyId===company), accIds=accs.map(a=>a.id);
  let ts=data.tasks.filter(t=>accIds.includes(t.accountId)&&dayOf(t)===n);
  let off=getOffDays(), isOff=off.includes(n);
  let doneAccs=accs.filter(a=>Array.isArray(a.doneDays)&&a.doneDays.includes(n));
  if(ts.length||isOff||doneAccs.length){
   if(!confirm("O dia "+n+" tem "+ts.length+" pendência(s) e/ou está marcado como feriado/concluído. Remover este dia vai apagar esses registros. Deseja continuar?")) return;
   data.tasks=data.tasks.filter(t=>!(accIds.includes(t.accountId)&&dayOf(t)===n));
   let oi=off.indexOf(n); if(oi>=0) off.splice(oi,1);
   doneAccs.forEach(a=>{let di=a.doneDays.indexOf(n); if(di>=0)a.doneDays.splice(di,1)});
  }
  selectedDays=selectedDays.filter(d=>d!==n);
 }
 co.totalDays=next;
 save();render();
}

}

/* ---------- Minhas pendências ---------- */
function renderMine(){
 const meId=current.id;
 const mine=data.tasks.filter(t=>(t.responsaveis||[]).includes(meId))
   .slice().sort((a,b)=>(a.status===b.status?String(a.day||"").localeCompare(String(b.day||"")):a.status==="pendente"?-1:1));
 const kitems=[].concat(
  data.kanban.receber.filter(i=>(i.responsaveis||[]).includes(meId)).map(i=>Object.assign({},i,{kind:"receber"})),
  data.kanban.pagar.filter(i=>(i.responsaveis||[]).includes(meId)).map(i=>Object.assign({},i,{kind:"pagar"}))
 ).sort((a,b)=>(a.status==="feito")-(b.status==="feito"));
 const pend=mine.filter(t=>t.status==="pendente");
 const kAbertos=kitems.filter(i=>i.status!=="feito");
 const pagar=pend.filter(t=>t.type==="A pagar").reduce((s,t)=>s+Number(t.value||0),0)
   +kAbertos.filter(i=>i.kind==="pagar").reduce((s,i)=>s+Number(i.value||0),0);
 const receber=pend.filter(t=>t.type==="A receber").reduce((s,t)=>s+Number(t.value||0),0)
   +kAbertos.filter(i=>i.kind==="receber").reduce((s,i)=>s+Number(i.value||0),0);
 const abertas=pend.length+kAbertos.length;
 const concluidas=mine.filter(t=>t.status==="concluida").length+kitems.filter(i=>i.status==="feito").length;
 $("root").innerHTML=`<div class="app">
${headerHtml()}
<nav class="tabs">${tabsHtml()}</nav>
<main class="main">
<div class="head"><div><div class="eyebrow">Módulo</div><h2 class="title">Minhas pendências</h2><div class="hint">Tudo que está atribuído a ${esc(current.name)}, em todas as empresas e quadros.</div></div></div>
<div class="summary"><div><div class="sumlabel">A pagar</div><div class="sumvalue" style="color:#9E4530">${brl(pagar)}</div></div><div class="divider"></div><div><div class="sumlabel">A receber</div><div class="sumvalue" style="color:#2F5233">${brl(receber)}</div></div><div class="divider"></div><div><div class="sumlabel">Em aberto</div><div class="sumvalue">${abertas}</div></div><div class="divider"></div><div><div class="sumlabel">Concluídas</div><div class="sumvalue">${concluidas}</div></div></div>

<div class="mysec"><div class="mysectitle">Nas contas bancárias</div><div class="mybox">${mine.length?mine.map(mineRowTask).join(""):'<div class="meta" style="padding:14px;text-align:center">Nenhuma pendência atribuída a você nas contas.</div>'}</div></div>

<div class="mysec"><div class="mysectitle">Nos quadros A Receber / A Pagar</div><div class="mybox">${kitems.length?kitems.map(mineRowKanban).join(""):'<div class="meta" style="padding:14px;text-align:center">Nenhuma pendência atribuída a você nos quadros.</div>'}</div></div>
</main></div>`;
 bindMine();
}
function mineRowTask(t){
 const a=data.accounts.find(x=>x.id===t.accountId);
 const co=a?data.companies.find(c=>c.id===a.companyId):null;
 const done=t.status==="concluida";
 const dia=String(t.day||"").split("-").reverse().join("/");
 return `<div class="task" data-minetask="${t.id}"><span class="check ${done?"done":""}" style="display:grid;place-items:center;font-size:12px">${done?"✓":""}</span><div class="taskbody"><div class="desc ${done?"done":""}">${esc(t.description)}</div><div class="taskmeta">${esc(co?.name||"—")} · ${esc(a?.name||"conta removida")} · ${dia} · <span style="color:${t.type==="A receber"?"#2F5233":"#9E4530"}">${esc(t.type||"A pagar")}</span>${t.observacao?" · 📝":""}</div></div><div class="taskval" style="${done?"color:#6B6A57":""}">${brl(t.value)}</div></div>`

function mineRowKanban(i){
 const st=KSTATUS.find(k=>k[0]===i.status);
 const lbl=st?st[1]:i.status;

 return `<div class="task" data-minekanban="${i.id}" data-minekind="${i.kind}"><span class="check ${done?"done":""}" style="display:grid;place-items:center;font-size:12px">${done?"✓":""}</span><div class="taskbody"><div class="desc ${done?"done":""}">${esc(i.description)}</div><div class="taskmeta">${i.kind==="receber"?"Pendências A Receber":"Pendências A Pagar"} · ${esc(lbl)}${i.observacao?" · 📝":""}</div></div><div class="taskval" style="color:${done?"#6B6A57":(i.kind==="receber"?"#2F5233":"#9E4530")}">${brl(i.value)}</div></div>`

function saveRecurring(){
 const desc=$("rdesc").value.trim();if(!desc)return;
 const accountId=$("racc").value;if(!accountId)return;
 const type=$("rtype").value;
 const mode=$("rmode").value;
 const day=mode==="monthday"?Math.min(31,Math.max(1,Number($("rday").value)||1)):null;
 const weekday=mode==="weekday"?Number($("rweekday").value):null;
 const value=parseNum($("rval").value);
 const responsaveis=Array.from(document.querySelectorAll("#rrespbox input:checked")).map(c=>c.value);
 if(recurringFormOpen&&recurringFormOpen!=="new"){
  let r=data.recurring.find(x=>x.id===recurringFormOpen);
  if(r){r.description=desc;r.accountId=accountId;r.type=type;r.scheduleMode=mode;r.day=day;r.weekday=weekday;r.value=value;r.responsaveis=responsaveis;}
 }else{
  data.recurring.push({id:uid(),description:desc,accountId,type,scheduleMode:mode,day,weekday,value,responsaveis,createdBy:current.name});
 }
 recurringFormOpen=null;
 save();render();
}

function handleDayClick(n,e){
 if(e&&(e.ctrlKey||e.metaKey)){
  let i=selectedDays.indexOf(n);
  if(i>=0)selectedDays.splice(i,1);else selectedDays.push(n);
 }else{
  selectedDays=(selectedDays.length===1&&selectedDays[0]===n)?[]:[n];
 }
 render();
}

/* ---------- Atualização pontual dos dias marcados (sem re-render da tela) ---------- */
function refreshDays(days){
 if(!selected||!days||!days.length)return;
 const ts=data.tasks.filter(t=>t.accountId===selected);
 const off=getOffDays(), done=getDoneDays();
 days.forEach(n=>{
  const el=document.querySelector('[data-day="'+n+'"]');
  if(el){
   const tmp=document.createElement("div");
   tmp.innerHTML=dayBox(n,ts,selectedDays,off,done);
   const nb=tmp.firstElementChild;
   nb.onclick=(e)=>handleDayClick(n,e);
   el.replaceWith(nb);
  }
 });
 const multi=days.length>1;
 const allOff=days.every(d=>off.includes(d));
 const allDone=days.every(d=>done.includes(d));
 const tOff=$("toggleOff");
 if(tOff){
  tOff.textContent=allOff?"✓ Fim de semana/feriado":(multi?"Marcar como fim de semana/feriado":"Marcar fim de semana/feriado");
  tOff.classList.toggle("on",allOff);
 }
 const tDone=$("toggleDone");
 if(tDone){
  tDone.textContent=allDone?"✓ Concluído":(multi?"Marcar dias como concluídos":"Marcar dia como concluído");
  tDone.classList.toggle("on",allDone);
 }
}

function editAccount(field){let a=data.accounts.find(x=>x.id===selected), el=field==="name"?$("editName"):$("editBank"), old=a[field]||"";let inp=document.createElement("input");inp.className="input";inp.value=old;el.replaceWith(inp);inp.focus();inp.select();let done=()=>{a[field]=inp.value.trim();save();render()};inp.onblur=done;inp.onkeydown=e=>{if(e.key==="Enter")done();if(e.key==="Escape")render()}}
